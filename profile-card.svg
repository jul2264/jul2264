<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 185" width="860" height="185">
  <style>
    .term-title { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #8b949e; font-weight: 600; }
    .term-prompt { fill: #58a6ff; }
    
    .name-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 20px;
      font-weight: bold;
      fill: #58a6ff;
    }

    .role-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #79c0ff;
    }

    .bio-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12.5px;
      fill: #c9d1d9;
    }
  </style>

  <!-- Frame -->
  <rect x="0" y="0" width="860" height="185" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  
  <!-- Header Bar -->
  <path d="M 0 10 A 10 10 0 0 1 10 0 L 850 0 A 10 10 0 0 1 860 10 L 860 32 L 0 32 Z" fill="#161b22" />
  <circle cx="20" cy="18" r="5" fill="#ff5f56" />
  <circle cx="36" cy="18" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="18" r="5" fill="#27c93f" />
  <text x="75" y="22" class="term-title"><tspan class="term-prompt">jul2264@github ~ $</tspan> whoami</text>

  <!-- Content -->
  <g>
    <!-- Name -->
    <text x="30" y="64" class="name-text">Julian Steve</text>
    
    <!-- Subtitle / Role -->
    <text x="30" y="88" class="role-text">Intern @ YugaYatra | 3rd Yr CS Student @ SRM University</text>
    
    <!-- Separator -->
    <line x1="30" y1="102" x2="830" y2="102" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Bio Paragraph -->
    <text x="30" y="124" class="bio-text">Full-Stack Developer &amp; Software Engineering Intern building scalable web apps,</text>
    <text x="30" y="142" class="bio-text">distributed systems, and intelligent search backends. Dedicated to sharpening DSA</text>
    <text x="30" y="160" class="bio-text">fundamentals, modern web architectures, and high-performance software.</text>
  </g>
</svg>
